name: Mise à jour quotidienne des données

on:
  # Du lundi au vendredi à 18h00 UTC (19h ou 20h à Paris), après la clôture des bourses européennes
  schedule:
    - cron: '0 18 * * 1-5'
  # Lancement manuel depuis l'onglet Actions (avec option d'email de test)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Envoyer aussi un email de test"
        type: boolean
        default: false
      resend_selection:
        description: "Renvoyer maintenant la sélection de la semaine (même si elle est déjà partie)"
        type: boolean
        default: false

permissions:
  contents: write

# Jamais deux exécutions en même temps : évite les doublons d'alertes et les conflits de commit
concurrency:
  group: donnees # update-data, history et publish : jamais deux à la fois sur les données
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # chaque étape de collecte a son propre délai : le job n'atteint jamais sa limite, l'enregistrement final s'exécute toujours
    timeout-minutes: 150

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Déclarations AMF (insider-pea)
        timeout-minutes: 15
        run: python run.py
        # Si la collecte échoue, Euro Signal le détecte et bloque les alertes au lieu de conclure « aucune transaction »
        continue-on-error: true

      - name: 2. Déclarations Belgique (FSMA) et Pays-Bas (AFM)
        timeout-minutes: 25
        run: python scrapers/europe_insiders.py
        continue-on-error: true

      - name: 2c. Positions vendeuses des fonds (AMF, Bundesanzeiger, CNMV, Consob, AFM, FSMA)
        timeout-minutes: 10
        run: python scrapers/shorts.py
        continue-on-error: true

      # Cours de la veille (non publiés dans le dépôt) : repris pour les titres où Yahoo ne répond pas ce soir
      - name: 2d. Cours de la veille (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.json
            data/sectors/weekly.csv.gz
            data/sectors/weekly_volume.csv.gz
          key: yahoo-${{ github.run_id }}
          restore-keys: yahoo-
        continue-on-error: true

      - name: 3. Cours Yahoo Finance
        timeout-minutes: 25
        run: python scrapers/prices.py
        continue-on-error: true

      - name: 3b. Secteurs et thèmes (cours hebdomadaires, test historique, classement du jour)
        timeout-minutes: 50
        run: |
          python scrapers/test_sectors.py > /tmp/test_sectors.txt || { cat /tmp/test_sectors.txt; exit 1; }
          python scrapers/test_yahoo.py > /tmp/test_yahoo.txt || { cat /tmp/test_yahoo.txt; exit 1; }
          python scrapers/sectors.py --prices --dashboard
        continue-on-error: true

      - name: 3c. Garder les cours pour demain (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices.json
            data/sectors/weekly.csv.gz
            data/sectors/weekly_volume.csv.gz
          key: yahoo-${{ github.run_id }}
        continue-on-error: true

      - name: 4. Résultats, communiqués et révisions (Yahoo Finance)
        timeout-minutes: 45
        env:
          EVENTS_MINUTES: '38'
        run: python scrapers/events.py
        continue-on-error: true

      - name: 4b. Comptes annuels (4 exercices, Yahoo Finance)
        timeout-minutes: 20
        run: python scrapers/test_financials.py && python scrapers/financials.py  # tests d'abord : une panne de Yahoo n'efface jamais les comptes
        continue-on-error: true

      - name: 4c. Actualité qualitative (titres de presse des sociétés à acheter ou à surveiller)
        timeout-minutes: 10
        run: python scrapers/news.py
        continue-on-error: true

      - name: 5a. Tests du moteur Euro Signal
        run: node euro_signal/tests.js && python scrapers/test_prices.py && python euro_signal/test_health.py

      - name: 5b. Calcul Euro Signal
        timeout-minutes: 10
        env:
          ES_RESEND_SELECTION: ${{ github.event.inputs.resend_selection }}
          ES_MAIL_READY: ${{ secrets.GMAIL_APP_PASSWORD != '' && 'oui' || 'non' }}
        run: node euro_signal/build.mjs

      - name: 5c. Archive permanente des résultats et rachats (jamais effacée)
        timeout-minutes: 5
        run: python scrapers/event_archive.py
        continue-on-error: true

      - name: 5d. Contrôle des fichiers produits (graphiques 1 an et 5 ans, plans d'entrée, secteurs)
        continue-on-error: true
        run: node euro_signal/check_outputs.mjs

      - name: 5e. Contrôle de l'affichage (toutes les fiches ouvertes comme sur un téléphone)
        timeout-minutes: 25
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node euro_signal/ui_check.mjs

      - name: 6. Alertes email (Gmail)
        timeout-minutes: 10
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ES_TEST_EMAIL: ${{ inputs.test_email }}
        run: python euro_signal/send_alerts.py

      - name: "6b. Vos positions - alertes de revente (lues dans votre Gmail, jamais écrites dans le dépôt)"
        timeout-minutes: 5
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python euro_signal/test_positions.py > /tmp/test_positions.txt && python euro_signal/positions.py || { cat /tmp/test_positions.txt; exit 1; }
        continue-on-error: true

      - name: 6c. Email de contrôle (seulement si un contrôle a trouvé un problème)
        timeout-minutes: 5
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python euro_signal/send_health.py

      - name: 7. Enregistrement des données
        # Toujours exécuté, même après une erreur, pour conserver le journal des alertes déjà envoyées
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add -A data/   # prices.json, events.json et la boîte d'envoi sont exclus par .gitignore
          if git diff --staged --quiet; then
            echo "Pas de changement, rien à commiter"
          else
            git commit -m "📊 Mise à jour données $(date -u +'%Y-%m-%d %H:%M UTC')"
            # si le code a été modifié pendant l'exécution, on se remet à jour avant d'envoyer (3 essais)
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi

      - name: 8. Publication du site (branche site, une seule version)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/publish-site
        with:
          message: "📊 Données du soir"
          token: ${{ secrets.GITHUB_TOKEN }}
