name: Mise à jour quotidienne des données

on:
  # Du lundi au vendredi à 17h37 UTC (18h37 ou 19h37 à Paris), après la clôture des bourses européennes. Pas à l'heure pile :
  # GitHub y retarde les tâches planifiées (avec « 0 18 », départs entre 20h30 et minuit UTC en octobre 2026, souvent après
  # minuit à Paris, quand Yahoo n'a pas encore la dernière séance de la zone euro)
  schedule:
    - cron: '37 17 * * 1-5'
  # Lancement manuel depuis l'onglet Actions (avec option d'email de test)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Envoyer aussi un email de test"
        type: boolean
        default: false
      resend_selection:
        description: "Renvoyer maintenant la sélection de la semaine (même si elle est déjà partie)"
        type: boolean
        default: false

permissions:
  contents: write

# Jamais deux exécutions en même temps : évite les doublons d'alertes et les conflits de commit
concurrency:
  group: donnees # update-data, history et publish : jamais deux à la fois sur les données
  cancel-in-progress: false

jobs:
  # Départ planifié arrivé en retard (GitHub peut le retarder de plusieurs heures) alors que le calcul du soir a déjà été fait,
  # relancé par la garde (watchdog.yml) ou à la main : on le saute. Sinon il refait tout, parfois après minuit à Paris, quand
  # Yahoo n'a plus la dernière séance de la zone euro (données moins complètes que le premier calcul).
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone

          run = "true"
          if os.environ["EVENT"] == "schedule":
              now = datetime.now(timezone.utc)
              d = now  # départ prévu le plus récent : 17h37 UTC du dernier jour de semaine passé
              while True:
                  start = d.replace(hour=17, minute=37, second=0, microsecond=0)
                  if d.weekday() < 5 and start <= now:
                      break
                  d -= timedelta(days=1)
              try:
                  out = subprocess.check_output(["gh", "run", "list", "--repo", os.environ["REPO"], "--workflow", "update-data.yml",
                                                 "--limit", "20", "--json", "databaseId,createdAt,conclusion"])
                  done = [r for r in json.loads(out) if str(r["databaseId"]) != os.environ["RUN_ID"] and r["conclusion"] == "success"
                          and datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= start - timedelta(minutes=30)]
              except Exception as e:  # garde muette : on calcule quand même
                  print("Garde : vérification impossible,", e)
                  done = []
              if done:
                  run = "false"
                  print(f"Calcul du soir déjà fait depuis le départ prévu ({start:%d/%m %H:%M} UTC) : ce départ en retard est sauté")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={run}\n")
          PY

  update-data:
    needs: garde
    if: needs.garde.outputs.run == 'true'
    runs-on: ubuntu-latest
    # chaque étape de collecte a son propre délai : le job n'atteint jamais sa limite, l'enregistrement final s'exécute toujours
    timeout-minutes: 150

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: 0. Données de la veille (branche site)
        id: restore
        uses: ./.github/actions/restore-data

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation des dépendances
        id: deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Déclarations AMF (insider-pea)
        id: s1
        timeout-minutes: 15
        run: python run.py
        # Si la collecte échoue, Euro Signal le détecte et bloque les alertes au lieu de conclure « aucune transaction »
        continue-on-error: true

      - name: 2. Déclarations Belgique (FSMA) et Pays-Bas (AFM)
        id: s2
        timeout-minutes: 25
        run: python scrapers/europe_insiders.py
        continue-on-error: true

      - name: 2c. Positions vendeuses des fonds (AMF, Bundesanzeiger, CNMV, Consob, AFM, FSMA)
        id: s2c
        timeout-minutes: 10
        run: python scrapers/shorts.py
        continue-on-error: true

      # Cours de la veille (non publiés dans le dépôt) : repris pour les titres où Yahoo ne répond pas ce soir
      - name: 2d. Cours de la veille (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.json
            data/sectors/weekly.csv.gz
            data/sectors/weekly_volume.csv.gz
          key: yahoo-${{ github.run_id }}
          restore-keys: yahoo-
        continue-on-error: true

      - name: 3. Cours Yahoo Finance
        id: s3
        timeout-minutes: 25
        run: python scrapers/prices.py
        continue-on-error: true

      - name: 3b. Secteurs et thèmes (cours hebdomadaires, test historique, classement du jour)
        id: s3b
        timeout-minutes: 50
        run: |
          python scrapers/test_sectors.py > /tmp/test_sectors.txt || { cat /tmp/test_sectors.txt; exit 1; }
          python scrapers/test_yahoo.py > /tmp/test_yahoo.txt || { cat /tmp/test_yahoo.txt; exit 1; }
          python scrapers/sectors.py --prices --dashboard
        continue-on-error: true

      # Clôture du soir manquante chez Yahoo (calcul tardif, panne) : prise à la bourse elle-même (Euronext, Nasdaq Nordic)
      - name: 3c. Cours de secours (Euronext, Nasdaq Nordic)
        id: s3c
        timeout-minutes: 12
        run: |
          python scrapers/test_backup.py > /tmp/test_backup.txt || { cat /tmp/test_backup.txt; exit 1; }
          python scrapers/backup_prices.py
        continue-on-error: true

      - name: 3d. Garder les cours pour demain (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices.json
            data/sectors/weekly.csv.gz
            data/sectors/weekly_volume.csv.gz
          key: yahoo-${{ github.run_id }}
        continue-on-error: true

      - name: 4. Résultats, communiqués et révisions (Yahoo Finance)
        id: s4
        timeout-minutes: 45
        env:
          EVENTS_MINUTES: '38'
        run: python scrapers/events.py
        continue-on-error: true

      - name: 4b. Comptes annuels (4 exercices, Yahoo Finance)
        id: s4b
        timeout-minutes: 20
        run: python scrapers/test_financials.py && python scrapers/financials.py  # tests d'abord : une panne de Yahoo n'efface jamais les comptes
        continue-on-error: true

      - name: 4c. Actualité qualitative (titres de presse des sociétés à acheter ou à surveiller)
        id: s4c
        timeout-minutes: 10
        run: python scrapers/news.py
        continue-on-error: true

      - name: 5a. Tests du moteur Euro Signal
        id: s5a
        run: node euro_signal/tests.js && python scrapers/test_prices.py && python euro_signal/test_health.py

      - name: 5b. Calcul Euro Signal
        id: s5b
        timeout-minutes: 10
        env:
          ES_RESEND_SELECTION: ${{ github.event.inputs.resend_selection }}
          ES_MAIL_READY: ${{ secrets.GMAIL_APP_PASSWORD != '' && 'oui' || 'non' }}
        run: node euro_signal/build.mjs

      - name: 5c. Archive permanente des résultats et rachats (jamais effacée)
        id: s5c
        timeout-minutes: 5
        run: python scrapers/event_archive.py
        continue-on-error: true

      # Double calcul : un second programme, écrit à part en Python, refait le classement, la sélection des 5 et les 10 🎯 à partir
      # des mêmes cours et compare avec le moteur (un chiffre faux qui a l'air juste) ; son rapport est lu par le contrôle des fichiers
      - name: 5c bis. Double calcul (classement et sélection recalculés à part)
        id: s5t
        timeout-minutes: 5
        run: |
          python euro_signal/test_twin.py > /tmp/test_twin.txt || { cat /tmp/test_twin.txt; exit 1; }
          python euro_signal/twin_check.py
        continue-on-error: true

      - name: 5d. Contrôle des fichiers produits (graphiques 1 an et 5 ans, plans d'entrée, secteurs)
        id: s5d
        continue-on-error: true
        run: node euro_signal/check_outputs.mjs

      - name: 5e. Contrôle de l'affichage (toutes les fiches ouvertes comme sur un téléphone)
        id: s5e
        timeout-minutes: 25
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node euro_signal/ui_check.mjs

      # Envoi en échec (alerte retentée demain) : étape signalée par l'email de contrôle, sans arrêter la suite ; un mot de passe
      # Gmail révoqué (aucun email ne peut plus partir) est vu par la garde du matin (watchdog.yml, via data/diagnostics/mail.json)
      - name: 6. Alertes email (Gmail)
        id: s6
        timeout-minutes: 10
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ES_TEST_EMAIL: ${{ inputs.test_email }}
        run: python euro_signal/send_alerts.py

      - name: "6b. Vos positions - alertes de revente (lues dans votre Gmail, jamais écrites dans le dépôt)"
        id: s6b
        timeout-minutes: 5
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python euro_signal/test_positions.py > /tmp/test_positions.txt && python euro_signal/positions.py || { cat /tmp/test_positions.txt; exit 1; }
        continue-on-error: true

      # Toujours exécuté : une étape en échec (même poursuivie) ou un calcul arrêté avant la fin est signalé par email
      - name: 6c. Email de contrôle (seulement si un contrôle a trouvé un problème)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python euro_signal/send_health.py

      - name: 7. Enregistrement des données et publication du site (branche site, une seule version)
        # Toujours exécuté, même après une erreur, pour conserver le journal des alertes déjà envoyées
        id: s7
        if: always()
        uses: ./.github/actions/publish-site
        with:
          message: "📊 Données du soir"
          token: ${{ secrets.GITHUB_TOKEN }}

      # La publication peut échouer après l'email de contrôle (GitHub indisponible) : la page garderait alors en silence les
      # données de la veille. Second passage de l'email de contrôle, avec l'étape 7 en échec (données sauvegardées 30 jours)
      - name: 7b. Email si la publication a échoué
        if: always() && steps.s7.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python euro_signal/send_health.py
