# Contrôle automatique de chaque modification du code (et de chaque proposition de modification) :
# tests du moteur et des collecteurs, erreurs de code (ESLint, ruff), mise en forme (Prettier), versions des fichiers de la page.
# Les mises à jour de données du soir (dossier data/) ne déclenchent pas ce contrôle.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
    paths-ignore: ['data/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Moteur et page (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Tests du moteur
        run: npm test
      - name: Erreurs de code (ESLint)
        run: npm run lint
      - name: Mise en forme (Prettier)
        run: npm run format:check
      - name: Versions des fichiers de la page
        run: node tools/stamp.mjs --check

  python:
    name: Collecteurs et emails (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4  # le test du double calcul compare avec le moteur JavaScript
        with:
          node-version: '20'
      - run: pip install -r requirements.txt ruff==0.16.8
      - name: Erreurs de code (ruff)
        run: ruff check --select F scrapers euro_signal run.py
      - name: Tests
        run: |
          python euro_signal/test_positions.py
          python euro_signal/test_health.py
          python euro_signal/test_twin.py
          python scrapers/test_financials.py
          python scrapers/test_prices.py
          python scrapers/test_yahoo.py
          python scrapers/test_sectors.py
          python scrapers/test_backup.py
          python scrapers/test_sources.py

  # Calcul du soir rejoué sur les données publiées la veille (branche site) avec le code proposé : une modification qui ferait
  # planter le calcul, ou qui changerait le classement d'un côté seulement (moteur ou double calcul), est vue avant la fusion
  replay:
    name: Calcul du soir rejoué (données publiées)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Données de la veille (branche site)
        uses: ./.github/actions/restore-data
      # cours du dernier calcul du soir (cache, jamais publiés) : mêmes chemins que le calcul du soir, sinon le cache n'est pas retrouvé
      - name: Cours Euro Signal (cache du calcul du soir)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.json
            data/sectors/weekly.csv.gz
            data/sectors/weekly_volume.csv.gz
          key: yahoo-rejeu-${{ github.run_id }}
          restore-keys: yahoo-
        continue-on-error: true
      - name: Calcul à la date des données (euro_signal/build.mjs)
        run: |
          export ES_TODAY="$(python -c "import json; print(json.load(open('data/euro-signal.json'))['today'])")"
          node euro_signal/build.mjs > /tmp/build.log 2>&1 || { tail -60 /tmp/build.log; exit 1; }
          grep -E "Classement tendance|Tableau de bord" /tmp/build.log
      - name: Double calcul (classement, sélection des 5, 10 🎯)
        run: python euro_signal/twin_check.py --strict
