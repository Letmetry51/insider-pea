name: Recherche - essai de l'actualité qualitative

# Essai ponctuel du relevé de presse (scrapers/news.py) sans toucher au tableau de bord : résultat sur la branche recherche-resultats.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Relevé
        run: |
          mkdir -p research/out
          python scrapers/news.py | tee research/out/news.txt
          python -c "import json;d=json.load(open('data/news.json'));it=d['items'];print(len(it),'sociétés');[print(k, '|', x['k'] or '-', '|', x['d'], '|', x['s'], '|', x['t'][:110]) for k in list(it)[:25] for x in it[k][:3]]" | tee -a research/out/news.txt
      - name: Résultat sur la branche recherche-resultats
        if: always()
        run: |
          git config user.name "euro-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B recherche-resultats
          git add -f research/out/news.txt
          git commit -m "Essai actualité" || true
          git push -f origin recherche-resultats
