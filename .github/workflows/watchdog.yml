name: Garde du calcul du soir

# GitHub peut retarder de plusieurs heures, voire sauter, une tâche planifiée (sans prévenir personne). Ce garde vérifie que
# le calcul du soir a tourné depuis son départ prévu et le relance une seule fois sinon. Il ne calcule rien lui-même ; un
# second calcul le même soir est sans risque (emails déjà envoyés jamais renvoyés).
# Il échoue (GitHub prévient alors le propriétaire du dépôt par sa propre notification, sans passer par Gmail) quand le calcul
# a encore échoué après la relance, ou quand Gmail a refusé un envoi ou une lecture ce soir-là (mot de passe d'application
# révoqué : l'email de contrôle ne peut pas le dire, il passe par le même compte).
on:
  schedule:
    - cron: '13 21 * * 1-5' # 3 h 30 après le départ prévu du calcul du soir (17h37 UTC)
    - cron: '43 5 * * 2-6' # au petit matin, si la soirée n'a rien donné
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: garde
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calcul du soir fait ? Sinon, relance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          d = now  # départ prévu le plus récent : 17h37 UTC du dernier jour de semaine passé
          while True:
              start = d.replace(hour=17, minute=37, second=0, microsecond=0)
              if d.weekday() < 5 and start <= now:
                  break
              d -= timedelta(days=1)
          out = subprocess.check_output(["gh", "run", "list", "--repo", os.environ["REPO"], "--workflow", "update-data.yml",
                                         "--limit", "40", "--json", "createdAt,status,conclusion,event"])
          runs = [r for r in json.loads(out)
                  if datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= start - timedelta(minutes=30)]
          live = [r for r in runs if r["status"] != "completed" or r["conclusion"] == "success"]
          again = [r for r in runs if r["event"] == "workflow_dispatch"]
          print(f"Départ prévu : {start:%d/%m %H:%M} UTC ; exécutions depuis : {len(runs)} ; réussies ou en cours : {len(live)}")
          problems = []
          if live:
              print("Calcul du soir fait ou en cours : rien à faire")
          elif again:
              print("Déjà relancé une fois sans succès : pas de nouvelle relance")
              if all(r["status"] == "completed" for r in again):
                  problems.append("calcul du soir en échec, même après la relance : la page garde les données précédentes")
          else:
              subprocess.check_call(["gh", "workflow", "run", "update-data.yml", "--repo", os.environ["REPO"]])
              print("Calcul du soir absent ou en échec : relancé")
          # Gmail du dernier calcul (publié sur la branche site) : envoi ou lecture refusés depuis le départ prévu
          try:
              raw = subprocess.check_output(["gh", "api", "-H", "Accept: application/vnd.github.raw",
                                             f"repos/{os.environ['REPO']}/contents/data/diagnostics/mail.json?ref=site"])
              parts = (json.loads(raw).get("parts") or {}).items()
              for name, p in parts:
                  at = datetime.fromisoformat(str(p.get("at") or "1970-01-01T00:00:00+00:00").replace("Z", "+00:00"))
                  if at >= start and not p.get("ok"):
                      problems.append(f"Gmail a refusé un échange ce soir ({name} : {p.get('detail') or 'échec'}). Si cela se répète,"
                                      " le mot de passe d'application (secret GMAIL_APP_PASSWORD) est sans doute révoqué :"
                                      " plus aucun email Euro Signal ne part")
          except Exception as e:  # fichier absent (premier soir) ou API indisponible : rien à signaler
              print("État des emails non lu :", type(e).__name__)
          for p in problems:
              print("::error::" + p)
          raise SystemExit(1 if problems else 0)
          PY
