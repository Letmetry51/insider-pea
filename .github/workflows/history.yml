name: Historique des dirigeants (France, Suède)

on:
  # Chaque nuit à 02h40 UTC : rattrapage progressif, puis simple mise à jour une fois l'historique complet
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "run = collecte normale ; probe = vérification des formats (rien n'est écrit)"
        type: choice
        options: [run, probe]
        default: run
      minutes:
        description: "Durée maximale de collecte (minutes)"
        default: '150'
      skip:
        description: "Étapes à sauter (AMF,FI,OUT)"
        default: ''

permissions:
  contents: write

concurrency:
  group: donnees # update-data, history et publish : jamais deux à la fois sur les données
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Données de la veille (branche site)
        uses: ./.github/actions/restore-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pypdf
      - name: Secteurs, une fois par semaine (univers, révisions des analystes, test historique, Google Trends)
        timeout-minutes: 40
        run: |
          pip install pytrends || true
          python scrapers/sectors.py --weekly
          python scrapers/seasonality.py --monthly || true
        continue-on-error: true
      - name: Collecte de l'historique et résultats des achats
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          MINUTES: ${{ github.event.inputs.minutes || '150' }}
          SKIP: ${{ github.event.inputs.skip || '' }}
        run: |
          if [ "$MODE" = "probe" ]; then
            mkdir -p data/diagnostics && python scrapers/insider_history.py --probe 2>&1 | tee data/diagnostics/history-probe.txt
          else
            python scrapers/insider_history.py --minutes "$MINUTES" --skip "$SKIP"
          fi
      - name: Enregistrement et publication du site (branche site, une seule version)
        if: always()
        uses: ./.github/actions/publish-site
        with:
          message: "🗂️ Historique des dirigeants"
          token: ${{ secrets.GITHUB_TOKEN }}
