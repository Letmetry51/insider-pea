name: Historique des dirigeants (France, Suède)

on:
  # Chaque nuit à 02h40 UTC : rattrapage progressif, puis simple mise à jour une fois l'historique complet
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "run = collecte normale ; probe = vérification des formats (rien n'est écrit)"
        type: choice
        options: [run, probe]
        default: run
      minutes:
        description: "Durée maximale de collecte (minutes)"
        default: '150'
      skip:
        description: "Étapes à sauter (AMF,FI,OUT)"
        default: ''

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pypdf
      - name: Univers des secteurs (grandes et moyennes valeurs européennes, une fois par semaine)
        timeout-minutes: 35
        run: python scrapers/sectors.py --universe-if-older 7
        continue-on-error: true
      - name: Collecte de l'historique et résultats des achats
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          MINUTES: ${{ github.event.inputs.minutes || '150' }}
          SKIP: ${{ github.event.inputs.skip || '' }}
        run: |
          if [ "$MODE" = "probe" ]; then
            mkdir -p data/diagnostics && python scrapers/insider_history.py --probe 2>&1 | tee data/diagnostics/history-probe.txt
          else
            python scrapers/insider_history.py --minutes "$MINUTES" --skip "$SKIP"
          fi
      - name: Enregistrement
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          mkdir -p data/history data/diagnostics && touch data/diagnostics/history-probe.txt
          git add data/history data/diagnostics/history-probe.txt
          if [ -f data/sectors/universe.json ]; then git add data/sectors/universe.json; fi
          if git diff --staged --quiet; then
            echo "Pas de changement"
          else
            git commit -m "🗂️ Historique des dirigeants $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
