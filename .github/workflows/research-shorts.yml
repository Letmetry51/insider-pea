name: Recherche - ventes à découvert

# Test ponctuel à la demande : positions courtes publiées (AMF, FCA) et performance des sociétés en tendance.
# Ne modifie ni les données ni le tableau de bord ; rapport dans les journaux et en pièce jointe du lancement.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yfinance pandas numpy openpyxl requests
      - name: Test
        timeout-minutes: 100
        run: |
          set -o pipefail
          mkdir -p research/out
          python research/shorts.py 2>&1 | tee research/out/journal.txt
      - name: Résultats sur la branche recherche-resultats (lisibles sans télécharger les journaux)
        if: always()
        run: |
          git config user.name "euro-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B recherche-resultats
          git add -f research/out
          git commit -m "Résultats de la recherche ventes à découvert" || true
          git push -f origin recherche-resultats
