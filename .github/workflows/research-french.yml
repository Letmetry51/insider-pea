name: Recherche - biais du survivant (facteur French)

# Comparaison ponctuelle et gratuite de notre effet momentum avec le facteur momentum européen de Kenneth French.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - name: Comparaison
        run: python research/french_compare.py
      - name: Résultat sur la branche recherche-resultats
        if: always()
        run: |
          git config user.name "euro-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B recherche-resultats
          git add -f research/out/french.txt
          git commit -m "Comparaison French" || true
          git push -f origin recherche-resultats
