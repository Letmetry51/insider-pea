name: Secteurs - test historique

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pente
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p rep
          python scrapers/sectors.py --prices > rep/1-prices.txt 2>&1 || true
          python -W ignore scrapers/_croise.py > rep/4-croise.txt 2>&1 || true
      - name: Résultats
        if: always()
        run: |
          git config user.email actions@github.com; git config user.name bot
          git checkout -B secteurs-resultats
          git rm -r -q --cached . > /dev/null
          git add -f rep
          git commit -q -m "Croisement $(date -u +%H:%M)" && git push -f origin secteurs-resultats
