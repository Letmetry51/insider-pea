# Grain Signal : céréales (blé, escourgeon, orge de printemps, colza, maïs) et engrais azotés.
# Chaque matin du lundi au samedi (séance de la veille) : collecte, calcul, actualités traduites, lecture du marché de la semaine
# (le lundi, si le secret ANTHROPIC_API_KEY existe), rapport par email, publication sur la branche site (page grain-signal.html).
# L'outil décrit le marché (cours, technique, actualité) ; il ne donne aucun conseil de vente ou d'achat.
name: Grain Signal (céréales et engrais)

on:
  schedule:
    # Le calcul est lancé à 7h03 (heure de Paris) par une tâche planifiée Claude « Grain Signal : démarrage du matin » : le rapport du
    # matin part vers 7h30, avant l'ouverture des grains sur Euronext (10h45). Ce créneau GitHub (6h47 UTC) n'est qu'un filet de
    # sécurité : ses tâches planifiées partent souvent avec des heures de retard (8h30 le 9/11/2026).
    - cron: '47 6 * * 1-6'
  workflow_dispatch:
    inputs:
      comite:
        description: "Refaire la lecture du marché de la semaine maintenant (API Claude, ≈ 1 $)"
        type: boolean
        default: false
      test_email:
        description: "Envoyer aussi un email de test"
        type: boolean
        default: false
      rattrapage:
        description: "Récupérer l'historique Euronext depuis 2019 (jusqu'à 45 minutes au lieu de 8)"
        type: boolean
        default: false
  # essai d'une modification sur la branche grain-signal-essai : tout est calculé, rien n'est envoyé ni publié
  push:
    branches: [grain-signal-essai]

permissions:
  contents: write
  actions: read # relire la sauvegarde des historiques si le cache a été vidé

concurrency:
  group: donnees # même groupe qu'Euro Signal : jamais deux publications de la branche site en même temps
  cancel-in-progress: false

jobs:
  grain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GS_DRY: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 0. Données publiées (branche site)
        timeout-minutes: 5
        uses: ./.github/actions/restore-data

      # historiques bruts des cours (jamais publiés) gardés d'un matin à l'autre
      - name: 0b. Historiques Grain Signal (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/grain/prive
          key: grain-prive-${{ github.run_id }}
          restore-keys: grain-prive-
        continue-on-error: true

      # cache vidé (plus de 7 jours sans calcul) : dernière sauvegarde des historiques, plutôt que de repartir de zéro
      - name: 0c. Historiques Grain Signal (sauvegarde, si le cache est vide)
        if: steps.cache.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=grain-prive&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/prive.zip"
            mkdir -p data/grain/prive && unzip -o -q "$RUNNER_TEMP/prive.zip" -d data/grain/prive
            echo "Historiques restaurés depuis la sauvegarde $id"
          else
            echo "Aucune sauvegarde : historiques de départ"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation
        timeout-minutes: 5
        run: pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "openpyxl>=3.1,<4" "markdown>=3.5,<4" "yfinance>=0.2.40,<2" "pdfplumber>=0.11,<1" "python-calamine==0.9.1"

      - name: 1. Tests Grain Signal
        id: g1
        timeout-minutes: 3
        run: python grain_signal/test_grain.py

      - name: 2. Collecte (Euronext, Yahoo, CFTC, engrais, Banque mondiale)
        id: g2
        timeout-minutes: ${{ inputs.rattrapage && 60 || 25 }}
        env:
          GS_HISTO_BUDGET: ${{ inputs.rattrapage && '2700' || '480' }}
        run: python grain_signal/collect.py
        continue-on-error: true

      - name: 3. Calcul (cours, technique, engrais, alertes)
        id: g3
        timeout-minutes: 5
        run: python grain_signal/build.py

      # titres du jour traduits en impacts par l'API Claude (sans recherche web, quelques centimes) : avant la lecture de la semaine,
      # qui les lit ; un fait majeur part en alerte
      - name: 3b. Actualités traduites en impacts
        id: g3b
        timeout-minutes: 10
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python grain_signal/actualites.py

      - name: 4. Lecture du marché de la semaine (lundi ou à la demande)
        id: g4
        timeout-minutes: 25
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GS_COMITE: ${{ inputs.comite && 'force' || '' }}
        run: python grain_signal/comite.py

      - name: 5. Calcul avec l'actualité et la lecture du jour
        id: g5
        timeout-minutes: 5
        run: python grain_signal/build.py

      - name: 5b. Backtest des lectures (technique, humeur, géopolitique)
        timeout-minutes: 5
        continue-on-error: true
        run: python grain_signal/backtest.py

      # synthèse A4 jointe au rapport du matin, à la lecture hebdomadaire et à l'email de test : Chromium installé seulement ces jours-là
      - name: 5c. Synthèse PDF
        timeout-minutes: 10
        continue-on-error: true
        env:
          GS_TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          rm -f data/grain/prive/synthese.pdf
          if python grain_signal/rapport_pdf.py --besoin; then
            pip install "playwright==1.49.1"
            python -m playwright install --with-deps chromium
            python grain_signal/rapport_pdf.py
          fi

      - name: 6. Emails (Gmail)
        id: g6
        timeout-minutes: 5
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GRAIN_ALERT_TO: ${{ secrets.GRAIN_ALERT_TO }} # destinataires propres à Grain Signal (sinon ceux d'Euro Signal)
          GS_TEST_EMAIL: ${{ inputs.test_email }}
        run: python grain_signal/send_alerts.py

      - name: 7a. Historiques Grain Signal (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/grain/prive
          key: grain-prive-${{ github.run_id }}
        continue-on-error: true

      - name: 7c. Sauvegarde des historiques (35 jours)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: grain-prive
          # seulement les historiques qu'on ne peut pas retélécharger (cours Yahoo et CFTC exclus : relus chaque matin)
          path: |
            data/grain/prive/euronext.csv
            data/grain/prive/fert_fr.csv
            data/grain/prive/physique_hist.csv
          retention-days: 35
          overwrite: true
        continue-on-error: true

      - name: 7b. Résultats de l'essai (branche d'essai)
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: grain-signal-essai-${{ github.run_id }}
          path: data/grain/
          retention-days: 5
        continue-on-error: true

      - name: 8. Publication du site (branche site)
        if: always() && github.ref == 'refs/heads/main' && steps.g3.outcome == 'success'
        timeout-minutes: 15
        uses: ./.github/actions/publish-site
        with:
          message: "🌾 Grain Signal du matin"
          token: ${{ secrets.GITHUB_TOKEN }}
