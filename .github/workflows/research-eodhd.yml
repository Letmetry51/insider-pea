name: Recherche - couverture EODHD

# Vérification ponctuelle et gratuite : sociétés européennes retirées de la cote connues d'EODHD (clé dans le secret EODHD_API_KEY).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Comptage
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python research/eodhd_check.py
      - name: Résultat sur la branche recherche-resultats
        if: always()
        run: |
          git config user.name "euro-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin recherche-resultats || true
          git checkout -B recherche-resultats
          git add -f research/out/eodhd.txt
          git commit -m "Couverture EODHD" || true
          git push -f origin recherche-resultats
