<title>Euro Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : barre de titre + onglets ; classement dense ; fiche titre en deux colonnes (score | cours), cartes d'opérations au format des notifications MAR art. 19. */
:root{
  --bg:#EDF0EC; --surface:#F9FAF7; --sunk:#E3E8E3; --ink:#17201C; --muted:#56635C; --line:#CBD3CD;
  --accent:#0D6A56; --accent-ink:#FFFFFF; --accent-soft:#D5EAE2; --s1:#2a78d6; --s2:#eb6834;
  --good:#1F7A3E; --good-soft:#DCEFE1; --warn:#9A5B00; --warn-soft:#F6E8CF; --bad:#B0281F; --bad-soft:#F7DCD8; --neutral-soft:#E2E6E3;
  --f-insiders:#0E7A63; --f-buyback:#4A5FC1; --f-results:#B26B00; --f-market:#7C5AA8;
  --chart-line:#0D6A56; --chart-area:rgba(13,106,86,.10);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201C; --sunk:#0D1210; --ink:#E3EAE6; --muted:#97A59E; --line:#2C3832;
  --accent:#4CC3A3; --accent-ink:#06231B; --accent-soft:#173A31; --s1:#3987e5; --s2:#d95926;
  --good:#63C98D; --good-soft:#163222; --warn:#E5AB4E; --warn-soft:#382A12; --bad:#F2887C; --bad-soft:#3D1D19; --neutral-soft:#242D29;
  --f-insiders:#43BFA0; --f-buyback:#8E9DF2; --f-results:#E2A649; --f-market:#B99CE2;
  --chart-line:#4CC3A3; --chart-area:rgba(76,195,163,.12); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201C; --sunk:#0D1210; --ink:#E3EAE6; --muted:#97A59E; --line:#2C3832;
  --accent:#4CC3A3; --accent-ink:#06231B; --accent-soft:#173A31; --s1:#3987e5; --s2:#d95926;
  --good:#63C98D; --good-soft:#163222; --warn:#E5AB4E; --warn-soft:#382A12; --bad:#F2887C; --bad-soft:#3D1D19; --neutral-soft:#242D29;
  --f-insiders:#43BFA0; --f-buyback:#8E9DF2; --f-results:#E2A649; --f-market:#B99CE2;
  --chart-line:#4CC3A3; --chart-area:rgba(76,195,163,.12); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h2.vt{font-size:1.6rem;margin:8px 0 4px}
h3{font-size:1.06rem;margin-bottom:10px}
h3 .muted{font-family:var(--body);font-weight:400;font-size:.88rem}
h4{font-size:.95rem;margin-bottom:6px}
small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.muted{color:var(--muted)}
.lead{color:var(--muted);max-width:76ch;margin:0 0 14px}
.foot{color:var(--muted);font-size:.82rem;max-width:90ch;margin:10px 0 0}
.pad{padding:12px 0}.mt{margin-top:16px}
code,.code{font-family:var(--mono);font-size:.85rem}
button,.btn{font:500 .9rem var(--body);background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover,.btn.ghost:hover{background:var(--sunk)}
button.small{padding:4px 9px;font-size:.8rem}
button.link{background:none;border:0;color:var(--accent);padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%}
textarea.code{background:var(--sunk);line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* En-tête */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding-top:8px}

.logo{width:34px;height:34px;display:flex;align-items:flex-end;gap:3px;padding:5px;border-radius:8px;background:var(--ink);flex:none}
.logo i{flex:1;background:var(--bg);border-radius:1px}.logo i:nth-child(1){height:35%}.logo i:nth-child(2){height:62%}.logo i:nth-child(3){height:100%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}

.count{display:inline-block;min-width:1.5em;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 .72rem/1.5 var(--mono);text-align:center}

.chip{display:inline-block;font-size:.74rem;font-weight:500;padding:2px 8px;border-radius:12px;background:var(--neutral-soft);color:var(--ink);white-space:nowrap;margin:1px 0}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.neutral{background:var(--neutral-soft);color:var(--muted)}
.pill{display:inline-block;min-width:2.4em;text-align:center;font:500 .82rem var(--mono);padding:1px 6px;border-radius:4px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.neutral{background:var(--neutral-soft);color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}.zero{color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin:14px 0 6px}
.banner div{flex:1 1 320px;min-width:0}
.note{border-radius:var(--r);padding:8px 12px;margin:8px 0;font-size:.88rem;background:var(--neutral-soft)}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;min-width:0}
.card.bad{border-color:var(--bad)}

/* Synthèse */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.stat{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--line);padding:10px 14px}
.stat:hover{background:var(--surface);border-color:var(--accent)}
.stat.good{border-left-color:var(--good)}.stat.warn{border-left-color:var(--warn)}.stat.bad{border-left-color:var(--bad)}
.stat .lbl{font-size:.72rem;color:var(--muted)}
.stat .val{font:700 1.2rem var(--display)}
.stat .sub{font-size:.8rem;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.toolbar input[type=search]{flex:1 1 220px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.grid th,.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.88rem}
.grid thead th{font:600 .72rem var(--body);color:var(--muted);background:var(--sunk);position:sticky;top:0}
.grid tbody tr:last-child td{border-bottom:0}
.grid.small td,.grid.small th{font-size:.8rem;padding:5px 8px}
.grid tr.sub th{background:var(--sunk);font-size:.8rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.num{text-align:right!important;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.84rem}
.rowlink{cursor:pointer}.rowlink:hover td{background:var(--sunk)}
.scorecell{min-width:120px}
.scorecell .big{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.sbar{display:flex;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:3px;width:110px}
.sbar i{display:block;height:100%}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}.dtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;cursor:pointer;min-width:0}.dtile:disabled{cursor:default}.dtile .dti{font-size:1.6rem;line-height:1}.dtile b{font-size:.95rem;line-height:1.15;overflow-wrap:anywhere}.dtile small{font-size:.75rem;opacity:.8;line-height:1.2}.dtile.t-good{border-color:var(--good)}.dtile.t-warn{border-color:var(--warn)}.dtile.t-bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}.dashl{margin:0 0 10px}.linkbtn{background:none;border:0;padding:0;color:var(--accent,inherit);text-decoration:underline;font:inherit;cursor:pointer}.p3rules{font-weight:600;margin:4px 0}.rbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.rb{display:inline-block;font-size:.75rem;line-height:1.3;padding:1px 7px;border-radius:999px;background:var(--neutral-soft);white-space:nowrap}.rb.sl-strong,.rb.t-good{background:var(--good-soft);color:var(--good)}.rb.sl-mid{background:var(--good-soft)}.rb.t-warn{background:var(--warn-soft);color:var(--warn)}.rb.t-bad{background:var(--bad-soft);color:var(--bad)}.rb{max-width:100%;overflow-wrap:anywhere}.rb.t-bad{white-space:normal}.big.nb-good{color:var(--good)}.big.nb-bad{color:var(--bad);opacity:.7}.big.nb-warn{color:var(--warn)}.legend li{margin:4px 0}.rplan{white-space:nowrap}.rplan small{display:block;white-space:normal}@media(max-width:360px){.dash{grid-template-columns:1fr}}.lgflow{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}.lgflow li{display:grid;grid-template-columns:2.2em 1fr;column-gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk)}.lgflow .lgi{grid-row:1/3;font-size:1.3rem;text-align:center;white-space:nowrap;letter-spacing:-.25em}.lgflow small{color:var(--muted);font-size:.8rem}.lgkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.lgk{padding:8px;border-radius:10px;background:var(--good-soft);text-align:center}.lgk b{display:block;font-size:1.15rem;color:var(--good)}.lgk small{font-size:.72rem;line-height:1.2;display:block}.lgw{margin:6px 0 10px}.pickent{margin:6px 0 10px;padding:8px 10px;border-radius:10px;background:var(--good-soft)}.pickent.warn{background:var(--warn-soft)}.pickent b{display:block}.pickent small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}.probs{margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--good-soft)}.probs>small{display:block;font-size:.75rem}.pbs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}.pb{display:flex;flex-direction:column;line-height:1.2}.pb b{font-size:1rem;color:var(--good)}.pb.neg b{color:var(--bad)}.pb small{font-size:.7rem}.trackb{margin:10px 0 6px;padding:8px 10px;border-radius:10px;background:var(--sunk)}.trackb p{margin:0 0 6px}.tks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tk{display:flex;flex-direction:column;line-height:1.25}.tk b{font-size:1.05rem}.tk small{font-size:.72rem;color:var(--muted)}.slbar{margin:6px 0 10px}.slbar .slt{display:block;font-size:.85rem;font-weight:600;margin:0 0 4px}.slbar .fchip small{opacity:.75}.slbar .slt+.fchips+.slt{margin-top:8px}.brkx{margin:6px 0 0}.brkx p{margin:4px 0}.brk-good{color:var(--good)}.brk-bad{color:var(--bad)}.rbrk{display:block;font-weight:600;color:var(--good);white-space:nowrap}
.comore>section.card{border:0;box-shadow:none;background:none;padding:0;margin:14px 0 0}
.rslope{font-weight:600;line-height:1.3;margin-top:2px;white-space:normal!important}.rslope span{white-space:nowrap}.rslope.sl-strong{color:var(--good)}.rslope.sl-mid{color:var(--warn)}.rslope.sl-light{color:var(--muted,inherit);font-weight:400}
.rpills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rpill{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:10px;font-size:.8rem;background:var(--sunk);color:var(--ink);white-space:nowrap}
.rpill b{font:600 .8rem var(--mono);white-space:nowrap}.rpill small{display:inline!important;font-size:.72rem}
.rtab .scorecell small{display:inline!important}.rpill small{font-weight:400;color:var(--muted)}
.rpill.t-good{background:var(--good-soft);color:var(--good)}.rpill.t-mid{background:var(--warn-soft);color:var(--warn)}.rpill.t-bad{background:var(--bad-soft);color:var(--bad)}
.rgauges{display:grid;gap:6px;margin:8px 0 10px}
.rg{display:grid;grid-template-columns:7.2em 1fr 4.4em;align-items:center;gap:8px;font-size:.9rem}
.rg-t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}.rg-t i{display:block;height:100%;border-radius:5px;background:var(--muted)}
.rg.t-good .rg-t i{background:var(--good)}.rg.t-mid .rg-t i{background:var(--warn)}.rg.t-bad .rg-t i{background:var(--bad)}
.rg-v{font:600 .9rem var(--mono);text-align:right;white-space:nowrap}.rg-v small{font-weight:400;color:var(--muted)}
.linkbtn.suivn{display:block;text-align:left;font-size:1rem;padding:0;color:var(--ink);text-decoration:none}.linkbtn.suivn b{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pick3b{list-style:none;cursor:pointer;display:block;text-align:center;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--accent);color:var(--surface)}.pick3b::-webkit-details-marker{display:none}.pick3[open] .pick3b{margin-bottom:10px}
.pick3l{padding-left:1.2em;margin:8px 0}.pick3l li.pick3sep{list-style:none;margin:14px 0 4px -1.2em;font-size:.85rem;font-weight:600;color:var(--warn)}.pick3x b{font-weight:600}.pick3l li{margin:8px 0;cursor:pointer}.pick3l small{display:block;color:var(--muted)}
.lgone{font-size:1.02rem}.lgt td.num,.lgt th.num{white-space:nowrap;width:3.6em}
.eurh{color:var(--muted);font-weight:400;white-space:nowrap}
.weekc .weekl{margin:6px 0 0;padding-left:1.2em}.weekc .weekl li{margin:6px 0}.psyfold>section.card{border:0;box-shadow:none;background:none;padding:0;margin:10px 0 0}
.psy .psyh{margin:4px 0 6px}.psy .psyi{font-size:1.3rem;margin-right:4px}
.psyline{width:100%;height:56px;display:block;margin:6px 0 0;background:var(--sunk);border-radius:4px}
.psyline .psy-l{stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}.psyline .psy-dot{fill:var(--accent)}
.psyline .psy-low{fill:var(--good-soft)}.psyline .psy-high{fill:var(--bad-soft)}
.psyax{display:flex;justify-content:space-between;gap:6px;margin:2px 0 8px;font-size:.72rem}
.psyg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.psyc{padding:3px 9px;border-radius:12px;background:var(--sunk);font-size:.85rem;white-space:nowrap}.psyc b{font-family:var(--mono)}.psyc.on{background:var(--accent);color:var(--accent-ink)}
.rsort{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 8px}.rsort label{font-weight:600;font-size:.9rem}.rsort select{flex:1;min-width:150px}
.thsort{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;cursor:pointer}.thsort.on{color:var(--accent)}
.rtab .rplan{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.rcard .rhead{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:4px 0 0}
.rcard .rnote{font:700 2rem/1 var(--display)}
.rcard .rwhy{list-style:none;padding-left:0}.rcard .rwhy li{margin:2px 0}.rcard .t-warn{color:var(--warn)}
.rtab .rwhy1{color:var(--muted);font-size:.8rem;display:block;margin-top:2px}
.rtab td.num small{display:block;color:var(--muted);font-size:.75rem}
.oldlbl{margin:0 0 6px;font-size:.82rem;color:var(--muted)}
.stat.on{border-color:var(--accent);background:var(--accent-soft)}
.f-insiders{background:var(--f-insiders)}.f-buyback{background:var(--f-buyback)}.f-results{background:var(--f-results)}.f-market{background:var(--f-market)}
.fam{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 .7rem var(--mono);margin-right:3px;background:var(--sunk)!important;color:var(--muted)}
.fam.on{color:#fff}.fam.on.f-insiders{background:var(--f-insiders)!important}.fam.on.f-buyback{background:var(--f-buyback)!important}.fam.on.f-results{background:var(--f-results)!important}.fam.on.f-market{background:var(--f-market)!important}
.fam.neg{background:var(--bad-soft)!important;color:var(--bad)}
.reasons{font-size:.8rem;max-width:46ch}

/* Fiche */
.crumbs{margin:12px 0 4px}
.fhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.fhead h2{font-size:1.8rem;line-height:1.15}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
dl{margin:0}
.ids{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.ids dt{font-size:.68rem;color:var(--muted)}
.ids dd{margin:0;font-size:.88rem}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:16px 0}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.gauge .lbl{font-size:.72rem;color:var(--muted)}
.gauge .val{font:700 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.gauge .val small{display:inline;font-size:.9rem;color:var(--muted)}
.gauge .sub{font-size:.78rem;color:var(--muted)}
.track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:4px 0}
.track i{display:block;height:100%;background:var(--muted)}
.gauge.acc .track i{background:var(--accent)}.gauge.good .track i{background:var(--good)}.gauge.warn .track i{background:var(--warn)}.gauge.bad .track i{background:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:0 14px}
.fam-block{padding:8px 0;border-top:1px solid var(--line)}
.fam-block:first-of-type{border-top:0}
.fam-h{display:flex;align-items:center;gap:8px}
.fam-h .pts{margin-left:auto;font:500 .85rem var(--mono)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.fam-block ul,.checks{list-style:none;margin:6px 0 0;padding:0}
.fam-block li,.checks li{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;padding:3px 0}

.checks li{border-bottom:1px dashed var(--line);padding:5px 0}
.checks li.ok span::before{content:"✓ ";color:var(--good)}
.checks li.ko span::before{content:"• ";color:var(--warn)}
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;min-width:300px}
svg .grid{stroke:var(--line);stroke-width:1}

.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;margin:6px 0 0}
.legend2 i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.lg-buy{background:var(--good);border-radius:50%}.lg-sell{background:var(--bad);clip-path:polygon(0 0,100% 0,50% 100%)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.op{border:1px solid var(--line);border-top:3px solid var(--muted);border-radius:var(--r);padding:12px;background:var(--bg);min-width:0}
.op.buy{border-top-color:var(--good)}.op.sell{border-top-color:var(--bad)}.op.cancel{opacity:.6}
.op header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.op header>div{min-width:0;overflow-wrap:anywhere}
.mar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;margin-bottom:10px}
.mar dt{font-size:.68rem;color:var(--muted)}
.mar dd{margin:0;font-size:.85rem;overflow-wrap:anywhere}
.mar .code{display:inline-block;font:500 .66rem var(--mono);background:var(--ink);color:var(--bg);border-radius:3px;padding:0 4px;margin-right:5px;letter-spacing:0}
table.cmp th,table.cmp td{padding:5px 8px;border-bottom:1px solid var(--line);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp tbody th{text-align:left;font-weight:500;color:var(--muted)}
table.cmp thead th{font-size:.72rem;color:var(--muted);font-weight:600}
.evs{list-style:none;padding:0;margin:0}
.evs li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.evs li>div:first-child{flex:1 1 260px;min-width:0}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:.9rem}
.mailprev{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff;color:#1c2321;overflow-x:auto;max-height:520px;overflow-y:auto}
.mailprev a{color:#0D6A56}

/* Formulaires */
.form{display:grid;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.fld{display:grid;gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{color:var(--ink);font-size:.9rem;width:100%}
.form.inline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:8px}
.form.inline .fld{flex:1 1 160px}
fieldset.ctry{border:1px solid var(--line);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px}
fieldset.ctry legend{font-size:.8rem;color:var(--muted);padding:0 4px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop label{cursor:pointer}
.drop label b{color:var(--accent)}
.vsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
ul.small{font-size:.82rem;max-height:240px;overflow:auto}
.segs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px}
.segs button{background:var(--surface);color:var(--ink);border-color:var(--line)}
.segs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.segs button.on .count{background:var(--accent-ink);color:var(--accent)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.fchip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:5px 10px;font-size:.82rem;min-height:34px;cursor:pointer}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}.fchip.good span:first-child{color:var(--good)}.fchip.bad span:first-child{color:var(--bad)}.ffold summary .chip{margin-left:6px}.segs .box{font-size:.95em}

/* Guide */
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px;max-width:86ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.steps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .9rem var(--display)}
.steps li p{margin:0;color:var(--muted);font-size:.9rem}
.fourcol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
ul.plain{margin:0;padding-left:18px;font-size:.88rem}
ul.plain li{margin:3px 0}
.empty{text-align:left;max-width:640px;margin:48px 0;display:grid;gap:10px}
.empty h2{font-size:1.5rem}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);max-width:min(92vw,620px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.9rem;transition:transform .25s;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast{visibility:hidden}.toast.show{transform:translate(-50%,0);visibility:visible}
#busy[hidden]{display:none}
.show-s{display:none}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}
#busy{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:.85rem;z-index:19;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
#busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes backflash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}.backflash,.backflash td{animation:backflash 1.6s ease-out}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  .hide-s{display:none}
  .show-s{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  #top{grid-template-columns:1fr}
  .chips{justify-content:flex-start}
  .fhead h2{font-size:1.4rem}
  .gauge .val{font-size:1.6rem}
}
/* Opportunités : version lisible */
.selc h3{margin-bottom:2px}.selc .foot{margin:0 0 8px}ol.sel{margin:0;padding-left:1.4em}ol.sel li{padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}ol.sel li:first-child{border-top:0}ol.sel li small{display:block;color:var(--muted)}ol.sel li:hover{background:var(--sunk)}
.tabs .ts{display:none}@media (max-width:560px){.tabs .tl{display:none}.tabs .ts{display:inline}.tabs button{padding:8px 4px;flex:1 1 auto;font-size:.86rem}.tabs{gap:0}}
/* Carte « Je l'ai acheté » : bien détachée du conseil */
.buybox{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.buybox summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none;font-size:1.05rem}
.buybox summary::-webkit-details-marker{display:none}
.buybox summary b{display:block;color:var(--bad)}.buybox summary small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.buybox .bb-ic{font-size:1.6rem;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--bad);filter:saturate(1.1)}
.buybox summary::after{content:'›';margin-left:auto;font-size:1.6rem;color:var(--bad);transition:transform .15s}.buybox details[open] summary::after{transform:rotate(90deg)}
.buybox details[open] summary{margin-bottom:10px}
.slab{display:block;font:600 .72rem var(--mono);margin-top:3px}
b.slab{display:inline;font-size:.78rem}
.s-top{color:var(--good)}.s-strong{color:var(--accent)}.s-mid{color:var(--muted)}.s-low{color:var(--muted);opacity:.75}
p.scale{font-size:.85rem;color:var(--muted);margin:-4px 0 14px;max-width:90ch}
.chip.newc{background:var(--bad);color:#fff}.tk{cursor:pointer;white-space:nowrap}
.hist{font-size:.82rem;font-weight:600;white-space:nowrap}.h-rare{color:var(--good)}.h-good{color:#9A6B00}.h-wait{color:var(--muted)}
p.verdict{margin:6px 0 8px;padding:8px 12px;border-radius:8px;font-size:.92rem}.v-strong{background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid var(--good)}.v-normal{background:color-mix(in srgb,#E0B000 14%,var(--surface));border:1px solid #B38600}.v-weak,.v-na,.v-empty{background:var(--sunk);border:1px solid var(--line)}
.cc{display:inline-block;font:600 .66rem var(--mono);letter-spacing:.03em;padding:1px 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.stars{display:block;color:#D9A400;letter-spacing:1px;font-size:.95rem;line-height:1;white-space:nowrap}.stars.s1,.stars.s2{color:#B9BDB9}
ol.sel .stars{display:inline;font-size:1.15rem}.selnote{float:right;margin:0 0 0 8px}.stars.big{display:inline;font-size:1.9rem;letter-spacing:3px}
.starline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:6px 0 10px}.starline b{font-size:1.05rem}
.chip.pos-leader{background:var(--good);color:#fff}.chip.pos-challenger{background:color-mix(in srgb,var(--good) 25%,var(--surface));color:var(--ink)}
body.offline::before{content:'Hors connexion : dernier classement enregistré sur cet appareil';display:block;background:#8a6400;color:#fff;text-align:center;font-size:.85rem;padding:6px 10px}
/* Correctifs d'affichage (audit final) */
.gauge{min-width:0}.gauge .hist{white-space:normal;display:inline}
.op header .chip{white-space:normal;flex-shrink:1;max-width:46%;text-align:right}
.tablewrap td small a{word-break:break-all}
.chip.newc{background:#B0281F;color:#fff}
.stars .e{color:#9AA19B;font-style:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .h-good{color:#E6B84A}:root:not([data-theme="light"]) .stars .e{color:#5E6862}}
:root[data-theme="dark"] .h-good{color:#E6B84A}:root[data-theme="dark"] .stars .e{color:#5E6862}
/* Avis croisé et symboles */
.adv{display:inline-block;font-weight:700;font-size:.8rem;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.4}
.adv.big{font-size:1rem;padding:6px 14px}
.adv-priority{background:#DDF1E3;color:#1A5C33}.adv-watch{background:#FFF1C9;color:#6E4F00}.adv-wait{background:var(--sunk);color:var(--muted)}.adv-avoid{background:#FBDDD8;color:#8E2219}
.sigs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sg{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 2px;border-radius:6px;font-size:.85rem;cursor:help}
.sg-good{background:#E3F3E8}.sg-warn{background:#FFF1D6}.sg-bad{background:#FBD9D4;box-shadow:inset 0 0 0 1px #C0392B}.sg-info{background:var(--sunk)}
.sgcs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.sgc{font-size:.84rem;padding:3px 9px;border-radius:999px}.sgc.sg-good{color:#1A5C33}.sgc.sg-warn{color:#6E4F00}.sgc.sg-bad{color:#8E2219;font-weight:700}.sgc.sg-info{color:var(--muted)}
.advcard .advhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}.advcard .advhead .muted{font-size:.82rem}
.advcard.adv-b-priority{border-left:5px solid #1F7A3E}.advcard.adv-b-watch{border-left:5px solid #C99A00}.advcard.adv-b-avoid{border-left:5px solid #B0281F}.advcard.adv-b-wait{border-left:5px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sg-good,:root:not([data-theme="light"]) .sgc.sg-good{background:#1F3A2A}:root:not([data-theme="light"]) .sg-warn,:root:not([data-theme="light"]) .sgc.sg-warn{background:#3A3018}:root:not([data-theme="light"]) .sg-bad,:root:not([data-theme="light"]) .sgc.sg-bad{background:#4A1F1A}
 :root:not([data-theme="light"]) .sgc.sg-good{color:#9FDCB4}:root:not([data-theme="light"]) .sgc.sg-warn{color:#F0CE79}:root:not([data-theme="light"]) .sgc.sg-bad{color:#F5A99F}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.proof h4{margin:14px 0 4px}
/* Analyse des comptes */
.accv{margin:4px 0 10px;padding:8px 12px;border-radius:8px;background:var(--sunk)}.acc-good{background:color-mix(in srgb,var(--good) 13%,var(--surface))}.acc-bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}.acc-mixed{background:color-mix(in srgb,#E0B000 13%,var(--surface))}
table.acct th{font-weight:500;text-align:left}table.acct td,table.acct th{white-space:nowrap}
@media (max-width:560px){table.acct tbody th{white-space:normal;min-width:96px;max-width:118px;font-size:.84rem}table.acct td,table.acct th{padding:6px 5px!important}table.acct td{font-size:.8rem}}
.ar{font-weight:700;font-size:1.35rem;line-height:1}.ar-good{color:var(--good)}.ar-bad{color:var(--bad)}.ar-flat{color:var(--muted)}
.fsc{display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;font-family:var(--mono)}.fs-good{background:var(--good)}.fs-mid{background:#9A6B00}.fs-bad{background:var(--bad)}
ul.fsl{list-style:none;margin:6px 0;padding:0;columns:2 280px;column-gap:24px}ul.fsl li{padding:2px 0;break-inside:avoid}ul.fsl li.ok{color:var(--good)}ul.fsl li.ko{color:var(--bad)}ul.fsl li.na{color:var(--muted)}
/* Explication repliée derrière ⓘ : l'essentiel d'abord, le détail à la demande */
details.xpi{margin:6px 0 0;font-size:.82rem;color:var(--muted)}details.xpi>summary{cursor:pointer;list-style:none;display:inline-block;color:var(--accent);font-size:.8rem;padding:2px 0}details.xpi>summary::-webkit-details-marker{display:none}details.xpi[open]>summary{margin-bottom:4px}details.xpi p,details.xpi li{margin:4px 0}
.crit details.xpi{margin-top:4px}
/* Feux de décision : même code couleur partout (vert favorable, orange à surveiller, rouge défavorable, gris inconnu) */
.t-good{--fx:var(--good);--fxs:var(--good-soft)}.t-mid{--fx:var(--warn);--fxs:var(--warn-soft)}.t-bad{--fx:var(--bad);--fxs:var(--bad-soft)}.t-na{--fx:var(--muted);--fxs:var(--neutral-soft)}
span.t-good,span.t-mid,span.t-bad{color:var(--fx)}
.fx{display:flex;flex-wrap:wrap;gap:2px;margin:5px 0 1px}.fx-i{display:inline-flex;align-items:center;gap:1px;padding:0 4px 0 3px;border-radius:10px;background:var(--fxs);border:1px solid color-mix(in srgb,var(--fx) 45%,transparent);font-size:.78rem;line-height:1.35}
.fx-i b{font:600 .68rem var(--body);color:var(--fx);font-variant-numeric:tabular-nums}.fx-i.t-na{opacity:.55}
.fxb{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin:12px 0 4px}
button.fxb-i{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px 5px;background:var(--fxs);color:var(--ink);border:1px solid color-mix(in srgb,var(--fx) 50%,transparent);border-top:4px solid var(--fx);border-radius:8px;font:inherit;cursor:pointer;min-width:0}
button.fxb-i:disabled{opacity:1;cursor:default}button.fxb-i.t-na{opacity:.6}.fxb-ic{font-size:1.1rem;line-height:1.2}.fxb-i b{font:700 .9rem var(--body);color:var(--fx);white-space:nowrap}.fxb-i small{font-size:.68rem;color:var(--muted);margin-top:1px}
.fxb-sum{margin:2px 0 8px;font-size:.8rem;color:var(--muted)}
details.fold,.plan{scroll-margin-top:170px} /* sous l'en-tête fixe quand un feu y mène */
.miss{margin:6px 0 10px;font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 10px}.rep{margin:10px 0;text-align:right}a.repbtn{font-size:.85rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px}a.repbtn:hover{color:var(--ink)}
table.cmp{display:block;max-width:100%;overflow-x:auto} /* tableaux du journal : défilement horizontal plutôt qu'un débordement de l'écran */
/* Phase du cycle */
.cyc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:10px 0}.cyc>i{display:none}
.cyc-p{flex:1;min-width:0;text-align:center;padding:6px 2px;border-radius:6px;background:var(--sunk);color:var(--muted)}.cyc-p b{display:block;font-size:.72rem;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}.cyc-p small{font-size:.66rem;line-height:1.1}
.cyc-p.on{background:var(--accent);color:var(--accent-ink)}.cyc-p.on small{color:var(--accent-ink)}.cyc-p.alt{background:var(--accent-soft);color:var(--ink)}
.cyc-s{margin:6px 0;font-size:.88rem}.secst-k{margin:4px 0 2px;font-size:.86rem;line-height:1.5}.nw{white-space:nowrap}button.cyc-line{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
p.mood{margin:8px 0 10px;padding:8px 12px;border-radius:8px;background:var(--sunk);font-size:.92rem}.mood-fear{background:color-mix(in srgb,#3A6EA5 14%,var(--surface));border:1px solid #3A6EA5}.mood-greed{background:color-mix(in srgb,#E0B000 15%,var(--surface));border:1px solid #B38600}
.hero{margin:18px 0 4px;max-width:80ch}
.hero h2{font-size:1.55rem;margin-bottom:4px}
.hero p{margin:0;color:var(--muted)}
.disc{display:inline-block;font:700 1.02rem var(--display);font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:12px;white-space:nowrap}
.disc.deep{background:var(--good-soft);color:var(--good)}.disc.mid{background:var(--warn-soft);color:var(--warn)}.disc.low{background:var(--neutral-soft);color:var(--muted)}
.rbar{position:relative;height:16px;width:150px;margin-top:2px}
.rbar .rb-track{position:absolute;left:0;right:0;top:7px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--good),var(--line) 50%,var(--bad))}
.rbar .rb-paid,.rbar .rb-now{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px}
.rbar .rb-paid{border-radius:50%;background:transparent;border:2.5px solid var(--ink);width:13px;height:13px;margin-left:-6.5px;top:1.5px;z-index:2;box-shadow:0 0 0 1.5px var(--surface)}
.rbar .rb-now{background:var(--accent);border-radius:2px;border:2px solid var(--surface);width:11px;height:11px;margin-left:-5.5px;top:2.5px;z-index:1}
.lg-dot{color:var(--ink)}.lg-sq{color:var(--accent)}
.rb-lbl{display:flex;justify-content:space-between;width:150px;font-size:.66rem}
details.help{margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
details.help ul{margin-top:8px}
details.help .disc{font-size:.78rem}
.segs .count{margin-left:2px}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin:14px 0}
.brief>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.brief>div:first-child{border-left:4px solid var(--good)}.brief>div:last-child{border-left:4px solid var(--warn)}
.brief ul{margin:0;padding-left:18px;font-size:.92rem}.brief li{margin:4px 0}
details.fold summary{font:700 1.02rem var(--display);color:var(--ink)}
details.fold[open] summary{margin-bottom:10px}
