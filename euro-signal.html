<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="euro-signal.webmanifest"><meta name="theme-color" content="#17201C"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Euro Signal"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body>
<title>Euro Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : barre de titre + onglets ; classement dense ; fiche titre en deux colonnes (score | cours), cartes d'opérations au format des notifications MAR art. 19. */
:root{
  --bg:#EDF0EC; --surface:#F9FAF7; --sunk:#E3E8E3; --ink:#17201C; --muted:#56635C; --line:#CBD3CD;
  --accent:#0D6A56; --accent-ink:#FFFFFF; --accent-soft:#D5EAE2;
  --good:#1F7A3E; --good-soft:#DCEFE1; --warn:#9A5B00; --warn-soft:#F6E8CF; --bad:#B0281F; --bad-soft:#F7DCD8; --neutral-soft:#E2E6E3;
  --f-insiders:#0E7A63; --f-buyback:#4A5FC1; --f-results:#B26B00; --f-market:#7C5AA8;
  --chart-line:#0D6A56; --chart-area:rgba(13,106,86,.10);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201C; --sunk:#0D1210; --ink:#E3EAE6; --muted:#97A59E; --line:#2C3832;
  --accent:#4CC3A3; --accent-ink:#06231B; --accent-soft:#173A31;
  --good:#63C98D; --good-soft:#163222; --warn:#E5AB4E; --warn-soft:#382A12; --bad:#F2887C; --bad-soft:#3D1D19; --neutral-soft:#242D29;
  --f-insiders:#43BFA0; --f-buyback:#8E9DF2; --f-results:#E2A649; --f-market:#B99CE2;
  --chart-line:#4CC3A3; --chart-area:rgba(76,195,163,.12); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201C; --sunk:#0D1210; --ink:#E3EAE6; --muted:#97A59E; --line:#2C3832;
  --accent:#4CC3A3; --accent-ink:#06231B; --accent-soft:#173A31;
  --good:#63C98D; --good-soft:#163222; --warn:#E5AB4E; --warn-soft:#382A12; --bad:#F2887C; --bad-soft:#3D1D19; --neutral-soft:#242D29;
  --f-insiders:#43BFA0; --f-buyback:#8E9DF2; --f-results:#E2A649; --f-market:#B99CE2;
  --chart-line:#4CC3A3; --chart-area:rgba(76,195,163,.12); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h2.vt{font-size:1.6rem;margin:8px 0 4px}
h3{font-size:1.06rem;margin-bottom:10px}
h3 .muted{font-family:var(--body);font-weight:400;font-size:.88rem}
h4{font-size:.95rem;margin-bottom:6px}
small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.muted{color:var(--muted)}
.lead{color:var(--muted);max-width:76ch;margin:0 0 14px}
.foot{color:var(--muted);font-size:.82rem;max-width:90ch;margin:10px 0 0}
.pad{padding:12px 0}.mt{margin-top:16px}
code,.code{font-family:var(--mono);font-size:.85rem}
button,.btn{font:500 .9rem var(--body);background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover,.btn.ghost:hover{background:var(--sunk)}
button.small{padding:4px 9px;font-size:.8rem}
button.link{background:none;border:0;color:var(--accent);padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%}
textarea.code{background:var(--sunk);line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* En-tête */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding-top:8px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand h1{font-size:1.45rem;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:.8rem}
.logo{width:34px;height:34px;display:flex;align-items:flex-end;gap:3px;padding:5px;border-radius:8px;background:var(--ink);flex:none}
.logo i{flex:1;background:var(--bg);border-radius:1px}.logo i:nth-child(1){height:35%}.logo i:nth-child(2){height:62%}.logo i:nth-child(3){height:100%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.tabs{grid-column:1/-1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);padding:8px 12px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.count{display:inline-block;min-width:1.5em;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 .72rem/1.5 var(--mono);text-align:center}

.chip{display:inline-block;font-size:.74rem;font-weight:500;padding:2px 8px;border-radius:12px;background:var(--neutral-soft);color:var(--ink);white-space:nowrap;margin:1px 0}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.neutral{background:var(--neutral-soft);color:var(--muted)}
.pill{display:inline-block;min-width:2.4em;text-align:center;font:500 .82rem var(--mono);padding:1px 6px;border-radius:4px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.neutral{background:var(--neutral-soft);color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}.zero{color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin:14px 0 6px}
.banner div{flex:1 1 320px;min-width:0}
.note{border-radius:var(--r);padding:8px 12px;margin:8px 0;font-size:.88rem;background:var(--neutral-soft)}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;min-width:0}
.card.bad{border-color:var(--bad)}

/* Synthèse */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.stat{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--line);padding:10px 14px}
.stat:hover{background:var(--surface);border-color:var(--accent)}
.stat.good{border-left-color:var(--good)}.stat.warn{border-left-color:var(--warn)}.stat.bad{border-left-color:var(--bad)}
.stat .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .val{font:700 1.2rem var(--display)}
.stat .sub{font-size:.8rem;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.toolbar input[type=search]{flex:1 1 220px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.grid th,.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.88rem}
.grid thead th{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);position:sticky;top:0}
.grid tbody tr:last-child td{border-bottom:0}
.grid.small td,.grid.small th{font-size:.8rem;padding:5px 8px}
.grid tr.sub th{background:var(--sunk);font-size:.8rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.num{text-align:right!important;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.84rem}
.rowlink{cursor:pointer}.rowlink:hover td{background:var(--sunk)}
.scorecell{min-width:120px}
.scorecell .big{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.sbar{display:flex;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:3px;width:110px}
.sbar i{display:block;height:100%}
.f-insiders{background:var(--f-insiders)}.f-buyback{background:var(--f-buyback)}.f-results{background:var(--f-results)}.f-market{background:var(--f-market)}
.fam{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 .7rem var(--mono);margin-right:3px;background:var(--sunk)!important;color:var(--muted)}
.fam.on{color:#fff}.fam.on.f-insiders{background:var(--f-insiders)!important}.fam.on.f-buyback{background:var(--f-buyback)!important}.fam.on.f-results{background:var(--f-results)!important}.fam.on.f-market{background:var(--f-market)!important}
.fam.neg{background:var(--bad-soft)!important;color:var(--bad)}
.reasons{font-size:.8rem;max-width:46ch}

/* Fiche */
.crumbs{margin:12px 0 4px}
.fhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.fhead h2{font-size:1.8rem;line-height:1.15}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
dl{margin:0}
.ids{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.ids dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ids dd{margin:0;font-size:.88rem}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:16px 0}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.gauge .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gauge .val{font:700 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.gauge .val small{display:inline;font-size:.9rem;color:var(--muted)}
.gauge .sub{font-size:.78rem;color:var(--muted)}
.track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:4px 0}
.track i{display:block;height:100%;background:var(--muted)}
.gauge.acc .track i{background:var(--accent)}.gauge.good .track i{background:var(--good)}.gauge.warn .track i{background:var(--warn)}.gauge.bad .track i{background:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:0 14px}
.fam-block{padding:8px 0;border-top:1px solid var(--line)}
.fam-block:first-of-type{border-top:0}
.fam-h{display:flex;align-items:center;gap:8px}
.fam-h .pts{margin-left:auto;font:500 .85rem var(--mono)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.fam-block ul,.checks{list-style:none;margin:6px 0 0;padding:0}
.fam-block li,.checks li{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;padding:3px 0}
.fam-block li b,.checks li b{font:500 .82rem var(--mono);white-space:nowrap}
.checks li{border-bottom:1px dashed var(--line);padding:5px 0}
.checks li.ok span::before{content:"✓ ";color:var(--good)}
.checks li.ko span::before{content:"• ";color:var(--warn)}
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;min-width:300px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font:11px var(--mono)}
svg .line{fill:none;stroke:var(--chart-line);stroke-width:1.8}
svg .area{fill:var(--chart-area);stroke:none}
svg .mk-buy{fill:var(--good);stroke:var(--surface);stroke-width:2}
svg .mk-sell{fill:var(--bad);stroke:var(--surface);stroke-width:1.5}
svg .last{fill:var(--chart-line)}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;margin:6px 0 0}
.legend2 i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.lg-buy{background:var(--good);border-radius:50%}.lg-sell{background:var(--bad);clip-path:polygon(0 0,100% 0,50% 100%)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.op{border:1px solid var(--line);border-top:3px solid var(--muted);border-radius:var(--r);padding:12px;background:var(--bg);min-width:0}
.op.buy{border-top-color:var(--good)}.op.sell{border-top-color:var(--bad)}.op.cancel{opacity:.6}
.op header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.mar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;margin-bottom:10px}
.mar dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mar dd{margin:0;font-size:.85rem;overflow-wrap:anywhere}
.mar .code{display:inline-block;font:500 .66rem var(--mono);background:var(--ink);color:var(--bg);border-radius:3px;padding:0 4px;margin-right:5px;letter-spacing:0}
table.cmp th,table.cmp td{padding:5px 8px;border-bottom:1px solid var(--line);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp tbody th{text-align:left;font-weight:500;color:var(--muted)}
table.cmp thead th{font-size:.72rem;color:var(--muted);font-weight:600}
.evs{list-style:none;padding:0;margin:0}
.evs li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.evs li>div:first-child{flex:1 1 260px;min-width:0}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:.9rem}
.mailprev{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff;color:#1c2321;overflow-x:auto;max-height:520px;overflow-y:auto}
.mailprev a{color:#0D6A56}

/* Formulaires */
.form{display:grid;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.fld{display:grid;gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{color:var(--ink);font-size:.9rem;width:100%}
.form.inline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:8px}
.form.inline .fld{flex:1 1 160px}
fieldset.ctry{border:1px solid var(--line);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px}
fieldset.ctry legend{font-size:.8rem;color:var(--muted);padding:0 4px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop label{cursor:pointer}
.drop label b{color:var(--accent)}
.vsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
ul.small{font-size:.82rem;max-height:240px;overflow:auto}
.segs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px}
.segs button{background:var(--surface);color:var(--ink);border-color:var(--line)}
.segs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.segs button.on .count{background:var(--accent-ink);color:var(--accent)}

/* Guide */
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px;max-width:86ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.steps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .9rem var(--display)}
.steps li p{margin:0;color:var(--muted);font-size:.9rem}
.fourcol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
ul.plain{margin:0;padding-left:18px;font-size:.88rem}
ul.plain li{margin:3px 0}
.empty{text-align:left;max-width:640px;margin:48px 0;display:grid;gap:10px}
.empty h2{font-size:1.5rem}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);max-width:min(92vw,620px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.9rem;transition:transform .25s;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast{visibility:hidden}.toast.show{transform:translate(-50%,0);visibility:visible}
#busy[hidden]{display:none}
.show-s{display:none}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}
#busy{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:.85rem;z-index:19;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
#busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  .hide-s{display:none}
  .show-s{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
  #top{grid-template-columns:1fr}
  .chips{justify-content:flex-start}
  .fhead h2{font-size:1.4rem}
  .gauge .val{font-size:1.6rem}
}
/* Opportunités : version lisible */
.selc h3{margin-bottom:2px}.selc .foot{margin:0 0 8px}ol.sel{margin:0;padding-left:1.4em}ol.sel li{padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}ol.sel li:first-child{border-top:0}ol.sel li small{display:block;color:var(--muted)}ol.sel li:hover{background:var(--sunk)}
.tabs .ts{display:none}@media (max-width:560px){.tabs .tl{display:none}.tabs .ts{display:inline}.tabs button{padding:8px 8px}}
/* Carte « Je l'ai acheté » : bien détachée du conseil */
.buybox{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.buybox summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none;font-size:1.05rem}
.buybox summary::-webkit-details-marker{display:none}
.buybox summary b{display:block;color:var(--bad)}.buybox summary small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.buybox .bb-ic{font-size:1.6rem;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--bad);filter:saturate(1.1)}
.buybox summary::after{content:'›';margin-left:auto;font-size:1.6rem;color:var(--bad);transition:transform .15s}.buybox details[open] summary::after{transform:rotate(90deg)}
.buybox details[open] summary{margin-bottom:10px}
.slab{display:block;font:600 .72rem var(--mono);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
b.slab{display:inline;font-size:.78rem}
.s-top{color:var(--good)}.s-strong{color:var(--accent)}.s-mid{color:var(--muted)}.s-low{color:var(--muted);opacity:.75}
p.scale{font-size:.85rem;color:var(--muted);margin:-4px 0 14px;max-width:90ch}
.hero{margin:18px 0 4px;max-width:80ch}
.hero h2{font-size:1.55rem;margin-bottom:4px}
.hero p{margin:0;color:var(--muted)}
.disc{display:inline-block;font:700 1.02rem var(--display);font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:12px;white-space:nowrap}
.disc.deep{background:var(--good-soft);color:var(--good)}.disc.mid{background:var(--warn-soft);color:var(--warn)}.disc.low{background:var(--neutral-soft);color:var(--muted)}
.rbar{position:relative;height:16px;width:150px;margin-top:2px}
.rbar .rb-track{position:absolute;left:0;right:0;top:7px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--good),var(--line) 50%,var(--bad))}
.rbar .rb-paid,.rbar .rb-now{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px}
.rbar .rb-paid{border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.rbar .rb-now{background:var(--accent);transform:rotate(45deg) scale(.8);border:2px solid var(--surface)}
.rb-lbl{display:flex;justify-content:space-between;width:150px;font-size:.66rem}
details.help{margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
details.help ul{margin-top:8px}
details.help .disc{font-size:.78rem}
.segs .count{margin-left:2px}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin:14px 0}
.brief>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.brief>div:first-child{border-left:4px solid var(--good)}.brief>div:last-child{border-left:4px solid var(--warn)}
.brief ul{margin:0;padding-left:18px;font-size:.92rem}.brief li{margin:4px 0}
details.fold summary{font:700 1.02rem var(--display);color:var(--ink)}
details.fold[open] summary{margin-bottom:10px}
details.fold .vt{display:none}
.advice .cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:4px 20px}
.advice h4{margin-top:4px}
details.pos{border-top:1px solid var(--line);padding-top:10px}
details.pos summary{font-size:1rem}
@media (max-width:900px){.hide-m{display:none}}
@media (max-width:640px){
  table.cards thead{display:none}
  table.cards tbody tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px;padding:12px;border-bottom:1px solid var(--line)}
  table.cards tbody tr:last-child{border-bottom:0}
  table.cards td{border:0!important;padding:0!important;text-align:left!important}
  table.cards td.c-name{grid-column:1/-1;font-size:1rem}
  table.cards td[data-l="Décote"]{grid-column:1/-1}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font:600 .64rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  table.cards td[data-l="Décote"]::before{display:none}
  .segs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .segs button{white-space:nowrap;flex:none}
  .hero h2{font-size:1.3rem}
  .summary{grid-template-columns:1fr 1fr}
  .summary .stat:last-child{grid-column:1/-1}
}

  function chart(isin) {

    h += '<section class="card"><h3>Remplissent les conditions aujourd\'hui <span class="muted">· ' + ready.length + '</span></h3>' + (ready.length ? '<ul class="evs">' + ready.map(function (i) { var c = S.computed[i]; return '<li><div><b>' + esc(S.inst[i].name) + '</b><small>score ' + c.score.total + ' · qualité ' + c.q.total + ' · dernier événement ' + c.score.lastEventDate + '</small></div><button class="ghost small" data-a="open" data-i="' + i + '">Voir</button></li>'; }).join('') + '</ul>' : '<p class="muted">Aucun titre ne remplit toutes les conditions aujourd\'hui. Les blocages sont détaillés dans chaque fiche.</p>') + '</section>';
    var log = Object.keys(S.alerts).map(function (k) { return S.alerts[k]; }).sort(function (x, y) { return (x.createdAt || '') < (y.createdAt || '') ? 1 : -1; });
    h += '<section class="card"><h3>Journal</h3>' + (log.length ? '<div class="tablewrap"><table class="grid"><thead><tr><th>Date</th><th>Société</th><th>Objet</th><th>Statut</th></tr></thead><tbody>' + log.slice(0, 200).map(function (x) { var st = ALERT_STATUS[x.status] || [x.status, 'neutral']; return '<tr><td>' + esc(String(x.createdAt || '').slice(0, 16).replace('T', ' ')) + '</td><td>' + esc(x.name || x.isin) + '</td><td>' + esc(x.subject || '') + (x.error ? '<small class="neg">' + esc(x.error) + '</small>' : '') + '</td><td><span class="chip ' + st[1] + '">' + st[0] + '</span></td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="muted">Aucune alerte pour l\'instant.</p>') +
      '<p class="foot">« Envoi non confirmé » ou « Statut incertain » : le message est peut-être parti sans confirmation. Il n\'est jamais renvoyé automatiquement ; vérifiez votre dossier Envoyés. « Échec » : rien n\'est parti, nouvelle tentative au prochain calcul.</p></section>';
    var fu = (S.snapshot && S.snapshot.followups) || [];
    h = h.replace('<h2 class="vt">Alertes</h2>', '<h2 class="vt">Alertes</h2>' + followSection(fu));
    return h;
  }
  /** Suivi de chaque alerte après envoi : performance, comparaison au CAC 40, signaux de sortie. */
  function followSection(fu) {
    var h = '<section class="card"><h3>Suivi des alertes <span class="muted">· ' + fu.length + '</span></h3>';
    if (!fu.length) return h + '<p class="muted">Aucune alerte à suivre pour l\'instant. Chaque alerte est suivie pendant un an : performance depuis l\'envoi, comparaison au CAC 40 et email si un signal de sortie apparaît.</p></section>';
    h += '<div class="tablewrap"><table class="grid cards"><thead><tr><th>Société</th><th>Alerte du</th><th class="num">Depuis l\'alerte</th><th class="num">CAC 40</th><th>Signaux de sortie</th></tr></thead><tbody>';
    fu.slice().sort(function (a, b) { return a.sentAt < b.sentAt ? 1 : -1; }).forEach(function (f) {
      h += '<tr class="rowlink" data-a="open" data-i="' + esc(f.isin) + '" tabindex="0"><td class="c-name"><b>' + esc(f.name || f.isin) + '</b>' + (f.status === 'simulee' ? '<small>alerte simulée (non envoyée)</small>' : '') + '</td><td data-l="Alerte du">' + shortDate(f.sentAt) + '</td>' +
        '<td class="num" data-l="Depuis l\'alerte"><span class="' + (f.perfPct >= 0 ? 'pos' : 'neg') + '">' + pct(f.perfPct) + '</span></td><td class="num" data-l="CAC 40">' + (f.benchPct != null ? pct(f.benchPct) : 'n.d.') + '</td>' +
        '<td data-l="Signaux de sortie">' + (f.signals.length ? f.signals.map(function (x) { return '<span class="chip warn">' + esc(x) + '</span>'; }).join(' ') : '<span class="chip good">aucun</span>') + '</td></tr>';
    });
    return h + '</tbody></table></div><p class="foot">Signaux de sortie : vente d\'un dirigeant, MM50 repassée sous la MM200, cours plus de ' + S.cfg.exits.belowInsiderPricePct + ' % sous le prix payé par les dirigeants, recul de ' + S.cfg.exits.drawdownFromPeakPct + ' % depuis le plus haut. Ce ne sont pas des ordres de vente.</p></section>';
  }
  /** Auto-apprentissage : ce que l'outil a mesuré et ajusté. */
  function learningSection(L) {
    var h = '<section class="card"><h3>Auto-apprentissage du barème <span class="chip ' + (L.mode === 'auto' ? 'good' : 'neutral') + '">' + (L.mode === 'auto' ? 'actif' : 'désactivé') + '</span></h3>' +
      '<p class="lead">Chaque mois, Euro Signal compare chaque composante du score aux résultats réels : achats avec ou sans cette composante, écart avec le CAC 40 à ' + S.cfg.learning.horizon + ' séances. Un poids ne bouge que d\'un point par mois, seulement si l\'écart est net (t ≥ ' + S.cfg.learning.minT + ') sur au moins ' + S.cfg.learning.minCases + ' cas, et reste entre 0 et 2 fois sa valeur d\'origine. ' + (L.withOutcome || 0) + ' achats ont déjà un résultat à ' + S.cfg.learning.horizon + ' séances sur ' + (L.samples || 0) + ' suivis.</p>';
    h += '<ul class="plain">' + (L.stats || []).map(function (s) { return '<li><b>' + esc(s.label) + '</b> — ' + s.nWith + ' cas avec' + (s.meanWith != null ? ' : ' + pct(s.meanWith) + ' vs CAC 40' : '') + (s.meanWithout != null ? ', contre ' + pct(s.meanWithout) + ' sans' : '') + (s.t != null ? ' (t = ' + fmtN(s.t, 1) + ')' : '') + '<br><small class="muted">' + esc(s.action) + '</small></li>'; }).join('') + '</ul>';
    h += (L.log && L.log.length ? '<h4 class="mt">Historique des ajustements</h4><ul class="plain">' + L.log.slice().reverse().map(function (e) { return '<li>' + esc(e.month) + ' · ' + esc(e.label) + ' : ' + e.from + ' → ' + e.to + ' (écart ' + (e.effect >= 0 ? '+' : '') + e.effect + ' pt, ' + e.nWith + ' cas, t = ' + e.t + ')</li>'; }).join('') + '</ul>' : '<p class="foot">Aucun ajustement pour l\'instant : il faut plusieurs mois de résultats avant que les écarts soient nets.</p>');
    return h + '</section>';
  }
  /* ----- Sources ----- */
  function srcState(s) {
    if (!s) return { k: 'neutral', t: 'Jamais collectée' };
    if (s.status === 'absent') return { k: 'neutral', t: 'Non configurée' };
    if (s.status === 'echec') return { k: 'bad', t: 'En échec' };
    if (s.status === 'partiel') return { k: 'warn', t: 'Partielle' };
    if (!s.lastSuccess) return { k: 'neutral', t: 'Jamais collectée' };
    var age = ES.daysBetween(s.lastSuccess, S.today);
    return age <= S.cfg.sources.maxRegistryAgeDays ? { k: 'good', t: 'À jour (' + age + ' j)' } : { k: 'warn', t: 'En retard (' + age + ' j)' };
  }
  function vSources() {
    var h = '<h2 class="vt">Sources de données</h2><p class="lead">État de chaque source. Une source en échec ou en retard bloque les alertes des titres domiciliés dans le pays concerné : l\'absence d\'opération n\'est jamais confondue avec une absence de collecte.</p>';
    h += '<div class="tablewrap"><table class="grid"><thead><tr><th>Source</th><th>État</th><th class="hide-s">Pays couverts</th><th class="hide-s">Dernière collecte réussie</th><th class="hide-s">Dernier import</th><th></th></tr></thead><tbody>';
    var srcList = REGISTRIES.slice();
    Object.keys(S.src).forEach(function (n) { if (!srcList.some(function (r) { return r.name === n; })) srcList.push({ name: n, label: (S.src[n].kind ? S.src[n].kind + ' · ' : '') + (S.src[n].via || n), url: '' }); });
    if (S.ro) srcList.sort(function (x, y) { return (S.src[y.name] ? 1 : 0) - (S.src[x.name] ? 1 : 0); });
    srcList.forEach(function (r) {
      var s = S.src[r.name], st = srcState(s), l = s && s.log && s.log[0];
      h += '<tr><td><b>' + esc(r.name) + '</b><small>' + esc(r.label) + '</small>' + (ES.safeUrl(r.url) ? '<small><a href="' + esc(ES.safeUrl(r.url)) + '" target="_blank" rel="noopener">' + esc(r.url.replace('https://', '')) + '</a></small>' : '') + '</td><td><span class="chip ' + st.k + '">' + st.t + '</span>' + (s && s.note ? '<small>' + esc(s.note) + '</small>' : '') + '</td><td class="hide-s">' + esc(s && s.countries && s.countries.length ? s.countries.join(', ') : r.country || '—') + '</td><td class="hide-s">' + (s && s.lastSuccess || '—') + (s && s.coveredFrom ? '<small>publications du ' + s.coveredFrom + ' au ' + s.coveredTo + '</small>' : '') + '</td><td class="hide-s">' + (l ? l.accepted + ' acceptées · ' + (l.rejected || 0) + ' refusées' + (l.added != null ? ' · ' + l.added + ' nouvelles' : '') : '—') + '</td><td class="row">' + (S.ro ? (s && s.via ? '<small>' + esc(s.via) + '</small>' : '') : '<button class="ghost small" data-a="srcOk" data-n="' + esc(r.name) + '">Collecte sans opération</button><button class="ghost small" data-a="srcFail" data-n="' + esc(r.name) + '">Signaler un échec</button>') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<section class="card"><h3>Évaluation des fournisseurs</h3><p class="note warn">Informations à confirmer par vos propres essais : cette page n\'a pas pu consulter les sites des fournisseurs lors de sa construction. Aucun abonnement n\'est supposé souscrit.</p><div class="tablewrap"><table class="grid"><thead><tr><th>Fournisseur</th><th>Usage envisagé</th><th>Points à vérifier avant de payer</th></tr></thead><tbody>' +
      '<tr><td><b>Insider Screener API</b></td><td>Déclarations d\'initiés multi-pays (orientation envisagée : offre Pro)</td><td>Couverture et historique réels par pays, Italie en particulier (erreur de source signalée lors d\'un contrôle précédent) ; crédits pondérés par marché, endpoint et nombre de lignes ; droits de réutilisation ; identifiants stables et corrections.</td></tr>' +
      '<tr><td><b>Duceus</b></td><td>Alternative ou contrôle croisé</td><td>Couverture italienne annoncée comme partielle et limitée aux données courantes ; profondeur d\'historique ; format des corrections.</td></tr>' +
      '<tr><td><b>EODHD</b></td><td>Cours quotidiens, fondamentaux, calendrier de résultats</td><td>Places couvertes par l\'offre choisie ; endpoint groupé du dernier jour (évite les requêtes titre par titre) ; données d\'initiés à ne pas présumer couvrir l\'Europe ; consensus et date de capture du consensus.</td></tr>' +
      '<tr><td><b>Registres officiels</b></td><td>Contrôle et source de référence</td><td>Export réellement disponible (CSV, page web, PDF), pagination, conditions de réutilisation, traitement des corrections. L\'Italie passe largement par les publications des émetteurs.</td></tr>' +
      '</tbody></table></div><p class="foot">Budget : chargement initial = historique de cours de l\'univers (un appel par titre) + historique d\'initiés sur la période voulue ; fonctionnement courant = un fichier groupé de cours par jour + les nouvelles déclarations. Comparez ces volumes aux crédits et prix de chaque offre au moment de souscrire.</p></section>';
    return h;
  }

  /* ----- Validation ----- */
  function vValidation() {
    var bt = S.bt || { res: null };
    var h = '<h2 class="vt">Validation statistique</h2><p class="lead">Étude d\'événements sur les achats déclarés collectés automatiquement : entrée à l\'ouverture de la première séance après la publication, sortie à la clôture N séances plus tard, coûts aller-retour déduits, comparaison à un indice de référence, et séparation entre échantillon et période hors échantillon.</p>';
    if (bt.meta) h += '<p class="note">Étude recalculée chaque soir sur l\'archive des déclarations : ' + (bt.meta.events || 0) + ' événements, indice ' + esc(bt.meta.bench || 'aucun') + ', coûts ' + bt.meta.cost + ' %, horizons ' + (bt.meta.horizons || []).join(' et ') + ' séances, hors échantillon depuis le ' + esc(bt.meta.oosStart || '?') + '.</p>';
    if (bt.res) {
      if (!bt.res.length) h += '<p class="note warn">Aucun événement exploitable : il faut des achats publiés et assez de séances de cours après la publication.</p>';
      else {
        h += '<div class="tablewrap"><table class="grid"><thead><tr><th>Signal</th><th class="num">Horizon</th><th>Période</th><th class="num">N</th><th class="num">Moyenne nette</th><th class="num">Médiane</th><th class="num">% positifs</th><th class="num">Excès vs indice</th><th class="num">% battant l\'indice</th></tr></thead><tbody>' +
          bt.res.map(function (r) { return '<tr><td>' + esc(r.group) + '</td><td class="num">' + r.horizon + '</td><td>' + r.sample + '</td><td class="num">' + r.n + (r.n < 30 ? ' <span class="chip warn">faible</span>' : '') + '</td><td class="num">' + pct(r.mean) + '</td><td class="num">' + pct(r.median) + '</td><td class="num">' + fmtN(r.hit, 0) + ' %</td><td class="num">' + (r.meanExcess == null ? 'n.d.' : pct(r.meanExcess)) + '</td><td class="num">' + (r.hitExcess == null ? 'n.d.' : fmtN(r.hitExcess, 0) + ' %') + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }
      h += '<section class="card"><h3>Limites de cette étude</h3><ul class="plain"><li>Biais de survivance : seuls les titres présents dans votre univers actuel sont testés ; les sociétés radiées ou rachetées manquent.</li><li>Les événements d\'un même titre se chevauchent : ils ne sont pas indépendants, et les moyennes surestiment la précision.</li><li>Les dates de publication inconnues sont remplacées par la date de transaction, ce qui avance l\'entrée : ces cas sont optimistes.</li><li>En dessous d\'une trentaine d\'événements par ligne, les résultats ne permettent aucune conclusion.</li><li>Un bon résultat passé n\'autorise pas à présenter le score comme une probabilité de hausse. Les facteurs de sentiment restent dans l\'indicateur expérimental tant qu\'ils n\'ont pas montré de valeur ajoutée hors échantillon.</li></ul></section>';
    }
    if (S.snapshot && S.snapshot.learning) h += learningSection(S.snapshot.learning);
    return h;
  }
  function vAide() {
    var c = S.cfg, h = '<h2 class="vt">Comment ça marche</h2>';
    h += '<section class="card"><ol class="steps">' +
      step('Collecte, chaque soir de semaine', 'Déclarations des dirigeants de 6 pays (AMF, BaFin, CNMV, Consob, FSMA, AFM), cours, résultats, communiqués et données financières des sociétés.') +
      step('Tri des achats', 'Seuls comptent les achats volontaires de personnes physiques (ou de leur holding personnelle selon le réglage), d\'au moins ' + ES.fmtEur(c.insiders.minBuyerEur) + ' par dirigeant sur ' + c.insiders.clusterWindowDays + ' jours. Attributions gratuites, options, déclarations tardives et sociétés d\'investissement sont écartées.') +
      step('Score sur 100', 'Initiés (décote du prix payé, cluster, DG, panique), rachats d\'actions, résultats et tendance de marché. Le détail de chaque point est visible dans la fiche.') +
      step('Emails', 'Alerte : seulement si le score atteint ' + c.alerts.minScore + ' avec au moins ' + c.alerts.minFamilies + ' familles de signaux, des données à jour, une société financièrement solide et une information nouvelle. Sélection de la semaine : chaque lundi, les ' + ((c.selection || {}).size || 5) + ' meilleurs dossiers du moment (score d\'au moins ' + ((c.selection || {}).minScore || 0) + '), même quand aucune alerte ne part.') +
      step('Suivi et apprentissage', 'Chaque alerte et chaque achat que vous déclarez sont suivis ; chaque mois, l\'outil mesure ce qui a marché et ajuste son barème, avec des garde-fous.') + '</ol>' +
      '<p class="foot">Le score aide à trier ; ce n\'est pas une probabilité de hausse et aucun ordre n\'est passé. L\'éligibilité PEA est toujours à vérifier. Réglages : fichier euro_signal/config.json du dépôt GitHub.</p>' +
      '<p class="foot"><b>Sur téléphone :</b> menu du navigateur → « Ajouter à l\'écran d\'accueil » (Android) ou bouton Partager → « Sur l\'écran d\'accueil » (iPhone). Euro Signal s\'ouvre alors comme une application, et le dernier classement reste consultable sans connexion.</p></section>';
    var det = function (title, body) { return '<details class="card fold"><summary>' + title + '</summary>' + body + '</details>'; };
    h += det('Barème actuel (version ' + esc(c.scoringVersion) + ')', baremeTable());
    h += det('État des données', vSources());
    h += det('Résultats passés et auto-apprentissage', vValidation());
    h += det('Titres suivis', vUnivers());
    return h;
  }
  function baremeTable() {
    var W = S.cfg.weights, L = {
      insiders: [['anyBuy', 'Achat de dirigeant (au moins ' + ES.fmtEur(S.cfg.insiders.minBuyerEur) + ')'], ['amountBig', 'Montant cumulé ≥ ' + ES.fmtEur(S.cfg.insiders.bigAmountEur)], ['cluster', 'Cluster : ' + S.cfg.insiders.clusterMinBuyers + ' dirigeants ou plus en ' + S.cfg.insiders.clusterWindowDays + ' jours'], ['pair', '2 dirigeants en ' + S.cfg.insiders.clusterWindowDays + ' jours'], ['coordinatedCluster', 'Programme collectif probable'], ['ceoCfo', 'Achat du DG ou du DAF'], ['repeat', 'Achats répétés'], ['discountBig', 'Décote ≥ ' + W.insiders.discountBigPct + ' % sous le plus haut 52 semaines'], ['discountMedium', 'Décote ≥ ' + W.insiders.discountMediumPct + ' %'], ['panicBuy', 'Achat pendant une vente panique'], ['netSeller', 'Dirigeants vendeurs nets'], ['ceoCfoSale', 'Vente du DG ou du DAF']],
      buyback: [['announced', 'Programme de rachat annoncé'], ['executing', 'Rachats exécutés'], ['largeSize', 'Rachat ≥ ' + W.buyback.largeSizePct + ' % du capital'], ['suspended', 'Programme suspendu']],
      results: [['epsStrong', 'BPA nettement au-dessus du consensus'], ['epsMild', 'BPA au-dessus du consensus'], ['epsMiss', 'BPA sous le consensus'], ['revStrong', 'Chiffre d\'affaires nettement au-dessus'], ['revMild', 'Chiffre d\'affaires au-dessus'], ['guidanceRaised', 'Perspectives relevées'], ['guidanceLowered', 'Perspectives abaissées']],
      market: [['trend', 'Tendance de fond haussière (MM50 > MM200)'], ['goldenCrossAfterBuy', 'Croisement haussier après l\'achat'], ['relStrength', 'Plus fort que le marché européen sur 6 mois'], ['volume', 'Volumes en hausse'], ['liquidity', 'Titre très liquide']]
    }, N = { insiders: 'Initiés', buyback: 'Rachats d\'actions', results: 'Résultats', market: 'Marché' };
    return '<div class="tablewrap"><table class="grid small"><tbody>' + Object.keys(L).map(function (k) {
      return '<tr class="sub"><th>' + N[k] + '</th><th class="num">plafond ' + W[k].cap + '</th></tr>' + L[k].filter(function (x) { return W[k][x[0]] != null; }).map(function (x) { var v = W[k][x[0]]; return '<tr><td>' + esc(x[1]) + '</td><td class="num ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' : '') + v + '</td></tr>'; }).join('');
    }).join('') + '</tbody></table></div>';
  }
  function step(t, d) { return '<li><b>' + t + '</b><p>' + d + '</p></li>'; }
  function col(t, items) { return '<div><h4>' + t + '</h4><ul class="plain">' + items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'; }

  /* =========================== Actions =========================== */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]'); if (!el) return;
    var a = el.dataset.a, i = el.dataset.i;
    if (el.tagName === 'A') return;
    ev.preventDefault();
    if (a === 'view') { S.view = el.dataset.v; S.limit = 200; if (location.hash) history.replaceState(null, '', location.pathname + location.search); render(); window.scrollTo(0, 0); }
    else if (a === 'open') { S.sel = i; S.view = 'fiche'; try { history.replaceState(null, '', '#' + i); } catch (e) { } render(); window.scrollTo(0, 0); }
    else if (a === 'more') { S.limit += 200; render(); }
    else if (a === 'quick') { S.filters.quick = el.dataset.v; S.limit = 200; render(); }
    else if (a === 'posBuy' || a === 'posSell') posMail(i, a === 'posBuy' ? 'buy' : 'sell');
    else if (a === 'uni') { S.uniFilter = el.dataset.v; render(); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.f) { S.filters[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; S.limit = 200; render(); return; }
    if (t.dataset.tf) { S.txFilter[t.dataset.tf] = t.value; render(); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset.f === 'q') { S.filters.q = t.value; clearTimeout(t._tm); t._tm = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#f-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 250); }
  });
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('rowlink')) { ev.preventDefault(); ev.target.click(); }
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>

</body></html>
